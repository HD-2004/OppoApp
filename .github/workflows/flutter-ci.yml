name: Flutter CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  deploy-web:
    name: Deploy web to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-and-test
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        env:
          COGNITO_HOSTED_UI_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
          COGNITO_USER_POOL_CLIENT_ID: ${{ vars.COGNITO_USER_POOL_CLIENT_ID }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          page_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/"
          build_args=(
            --release
            --base-href "/${repo_name}/"
            --dart-define "COGNITO_WEB_REDIRECT_URI=${page_url}"
          )

          if [ -z "$COGNITO_HOSTED_UI_DOMAIN" ]; then
            echo "::error::Missing repository variable COGNITO_HOSTED_UI_DOMAIN. Set it to the same Cognito Hosted UI domain used by the website."
            exit 1
          fi

          build_args+=(--dart-define "COGNITO_HOSTED_UI_DOMAIN=${COGNITO_HOSTED_UI_DOMAIN}")

          if [ -n "$COGNITO_USER_POOL_CLIENT_ID" ]; then
            build_args+=(--dart-define "COGNITO_USER_POOL_CLIENT_ID=${COGNITO_USER_POOL_CLIENT_ID}")
          fi

          flutter build web "${build_args[@]}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
